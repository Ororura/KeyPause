name: KeyPause CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keypause-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build macOS
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build all Go packages
        run: go build ./...

      - name: Package macOS app and DMG
        run: ./scripts/build-dmg.sh

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/KeyPause.app dist/KeyPause.app.zip

      - name: Upload macOS builds
        uses: actions/upload-artifact@v4
        with:
          name: KeyPause-macOS-${{ runner.arch }}
          path: |
            dist/KeyPause.app.zip
            dist/KeyPause.dmg
          if-no-files-found: error
          retention-days: 14
